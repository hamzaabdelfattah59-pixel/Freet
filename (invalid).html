<style>
:root{--bg:#FAF7F0;--card:#FFFDF8;--ink:#0B3A5B;--mut:#5b7890;--ac:#38A9DB;--onac:#0B3A5B;--acs:#e2f1f8;--ok:#128a5e;--bad:#7A1F35;--ln:#e8e1d2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0a2438;--card:#0f3350;--ink:#FAF7F0;--mut:#9fbdd1;--ac:#38A9DB;--onac:#0B3A5B;--acs:#164a6c;--ok:#4ad69b;--bad:#e8809a;--ln:#1f4a68}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0a2438;--card:#0f3350;--ink:#FAF7F0;--mut:#9fbdd1;--ac:#38A9DB;--onac:#0B3A5B;--acs:#164a6c;--ok:#4ad69b;--bad:#e8809a;--ln:#1f4a68}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,Arial,sans-serif;line-height:1.6}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:18px 14px 40px}
.co{position:fixed;width:230px;height:230px;pointer-events:none;z-index:0}
.co.tr{top:0;right:0;transform:scaleX(-1)}.co.bl{bottom:0;left:0;transform:scaleY(-1)}
.co .a{fill:var(--ac);stroke:var(--ac)}.co .n{fill:var(--ink);stroke:var(--ink)}.co .b{fill:var(--bad);stroke:var(--bad)}
.co path{stroke-width:1.2;fill-opacity:.09;stroke-opacity:.35}.co .n{fill-opacity:.06;stroke-opacity:.25}.co .b{fill-opacity:.08;stroke-opacity:.35}
h1{font-size:34px;font-weight:800;margin:0;letter-spacing:-1px}
.tag{color:var(--mut);margin:0 0 12px;font-size:14px}
.nm{width:100%;font:inherit;font-weight:600;font-size:18px;background:transparent;border:0;border-bottom:2px solid var(--ln);color:var(--ink);padding:6px 0;margin-bottom:12px}
#nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}
#nav button{flex:none;font:inherit;font-weight:600;border:1px solid var(--ln);background:var(--card);color:var(--mut);padding:6px 14px;border-radius:99px}
#nav button.on{background:var(--ac);border-color:var(--ac);color:var(--onac)}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px;margin:10px 0}
.card h3{margin:0 0 8px;font-size:16px}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:8px 10px;min-width:0}
.f{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}.f input,.f select{flex:1 1 90px}
.btn{font:inherit;font-weight:600;background:var(--ac);color:var(--onac);border:0;border-radius:10px;padding:8px 16px}
.x{background:none;border:0;color:var(--mut);font-size:18px;padding:0 6px}
.r{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--ln)}.r:first-of-type{border-top:0}
.m{color:var(--mut);font-size:13px}.ok{color:var(--ok);font-weight:600}.bad{color:var(--bad);font-weight:600}
.chip{display:inline-flex;gap:4px;align-items:center;background:var(--acs);border-radius:99px;padding:3px 10px;margin:0 0 6px 6px;font-size:14px}
.big{background:var(--acs);border-radius:12px;padding:12px;font-weight:600}
.empty{color:var(--mut);text-align:center;padding:14px 0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.lg{margin:0 0 8px;background:#0B3A5B;border-radius:16px;overflow:hidden}.lg img{display:block;width:100%;height:auto}
#gate{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;align-items:center;justify-content:center;padding:20px;overflow:auto}
#gate .gc{width:100%;max-width:380px}
#gate img{display:block;width:100%;height:auto;border-radius:16px;margin-bottom:14px}
#gate h2{margin:0 0 4px;font-size:22px}
#gate input{width:100%;margin:6px 0}
#gate .btn{width:100%;margin-top:8px;padding:11px}
.er{color:var(--bad);min-height:22px;font-size:14px}
a.btn{display:block;text-align:center;text-decoration:none}
.don{background:var(--acs);border-radius:14px;padding:14px;margin:10px 0}

.rp{display:flex;flex-direction:column;align-items:center;margin:24px auto 0;max-width:340px;width:100%}
.rp-b{width:100%;margin-bottom:14px;padding:11px}
.rp-m{position:relative;isolation:isolate;width:100%;overflow:hidden;border-radius:24px;border:1px solid #06121c;background:#2d3c4a;padding:12px 12px 32px;box-shadow:0 20px 36px -20px rgba(6,18,28,.55),0 6px 14px -8px rgba(6,18,28,.25),inset 0 1px 0 rgba(255,255,255,.14),inset 0 -1px 0 rgba(6,18,28,.55)}
.rp-m::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;border-radius:inherit;opacity:.35;mix-blend-mode:soft-light;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.rp-h{position:relative;z-index:1;height:44px;display:flex;align-items:flex-start}
.rp-st{display:flex;align-items:center;gap:8px;color:#9fb3c4;font-size:12px;font-weight:600}
.rp-ic{width:18px;height:18px;display:grid;place-items:center}
.spin{width:14px;height:14px;border:2px solid #7d93a5;border-top-color:transparent;border-radius:50%;animation:rps .8s linear infinite}
@keyframes rps{to{transform:rotate(360deg)}}
.rp-s{position:relative;z-index:1;border-radius:12px;border:1px solid #06121c;background:#0a1620;color:#FAF7F0;padding:16px;box-shadow:inset 0 0 24px 4px rgba(0,0,0,.5)}
.rp-s .m3{font-size:12px;color:#7fb8d6}.rs-t{font-weight:800;font-size:18px}.rs-v{font-size:26px;font-weight:800;color:#38A9DB}
.rp-slot{position:absolute;z-index:40;left:24px;right:24px;bottom:12px;height:8px;border-radius:4px;background:#05101a;border:1px solid #05101a;box-shadow:inset 0 2px 4px #000}
.rp-o{position:relative;z-index:50;margin-top:-16px;width:calc(80% + 3rem);max-width:100%;overflow:hidden;padding:0 24px 28px}
.rp[data-stage="printing"] .rp-o::before,.rp[data-stage="complete"] .rp-o::before{content:"";position:absolute;left:24px;right:24px;top:-4px;height:8px;z-index:20;background:rgba(5,16,26,.75);filter:blur(6px);pointer-events:none}
.rp-f{position:relative;isolation:isolate;opacity:0;transform:translateY(calc(-100% + 2px));transition:opacity .16s cubic-bezier(.23,1,.32,1)}
.rp-f::before{content:"";position:absolute;inset:12px 12px 16px;z-index:0;border-radius:2px;box-shadow:0 8px 24px rgba(11,58,91,.28);pointer-events:none}
.rp-p{position:relative;z-index:1;background:#FFFDF8;color:#0B3A5B;font-family:"RcptMono","RcptAr",sans-serif;font-size:13px;line-height:1.75;letter-spacing:.01em;padding:24px 18px 32px}
.rp-p hr{border:0;border-top:1px dashed #9db3c4;margin:10px 0}
.rl{display:flex;justify-content:space-between;gap:10px;padding:2px 0}.rl.tt{font-weight:800;font-size:15px}
.rc{text-align:center}.rc .m2{font-size:12px;opacity:.7}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}

.ph{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}.ph img{width:70px;height:70px;border-radius:12px;object-fit:cover;display:block}

<p class="tag">اعرف مين فاضي، نظّم الخروجة، اقسم الفلوس بالعدل</p>
<input class="nm" id="nm" placeholder="اسم الخروجة" oninput="S.name=this.value;save()">
<div id="nav"></div>
<div id="main"></div>
</div>
<div id="gate" role="dialog" aria-modal="true" aria-label="تسجيل حساب">
<form class="gc" onsubmit="return authGo()" onkeydown="if(event.key==='Enter'){event.preventDefault();authGo()}">
<img id="gimg" alt="Freet">
<h2 id="gt">سجّل دخولك</h2>
<div class="m">حسابك على Freet، وكل واحد له بروفايله</div>
<div id="gnw"><input id="gn" placeholder="اسمك" autocomplete="name"></div>
<div id="guw"><input id="gu" dir="ltr" placeholder="يوزرنيم (إنجليزي وأرقام)" autocomplete="off" autocapitalize="none"></div>
<input id="gk" type="email" dir="ltr" placeholder="الإيميل" autocomplete="username">
<input id="gp" type="password" dir="ltr" placeholder="الباسورد (6 حروف على الأقل)" autocomplete="current-password">
<div class="er" id="ge"></div>
<button class="btn" id="gb" type="button" onclick="authGo()">دخول</button>
<button class="x" id="gsw" type="button" onclick="authSw()" style="width:100%;margin-top:8px;font-size:14px;text-decoration:underline"></button>
</form>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
let S={name:'خروجة الجمعة',people:[],avail:{},places:[],exp:[],est:0,tab:0,user:null};
try{const r=localStorage.getItem('freet');if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem('freet',JSON.stringify(S))}catch(e){}try{syncOut()}catch(e){}};
S=Object.assign({pf:{},psel:'',loc:{},date:'',ci:{},ck:{},oid:''},S);
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nm=id=>(S.people.find(p=>p.id===id)||{name:'؟'}).name;
const fmt=n=>Math.round(n*100)/100;
const hr=h=>(h%12||12)+(h>=12?' م':' ص');
const T=['الخروجات','الناس','الوقت','المكان','المصاريف','الحساب','التيكت','حسابي'];
const empty=t=>`<div class="empty">${t}</div>`;

function render(){
  $('#nm').value=S.name;
  $('#nav').innerHTML=T.map((t,i)=>`<button class="${S.tab===i?'on':''}" onclick="S.tab=${i};render()">${t}</button>`).join('');
  if(ME&&!S.oid&&S.tab>0&&S.tab!==7)$('#main').innerHTML=`<div class="card">${empty('اختار خروجة أو اعمل واحدة من تبويب «الخروجات»')}</div>`;else [v8,v0,v1,v2,v3,v4,v7,v5][S.tab]();
  applyTheme();gate();countUp();save();
}

/* الناس */
function v0(){
  const tot=S.people.reduce((a,p)=>a+p.budget,0);
  $('#main').innerHTML=`<div class="card"><h3>مين جاي وميزانية كل واحد</h3>
  <div class="f"><input id="pn" placeholder="الاسم"><input id="pb" type="number" inputmode="decimal" placeholder="الميزانية"><button class="btn" onclick="addP()">أضف</button></div>
  ${S.people.length?S.people.map(p=>`<div class="r"><span>${esc(p.name)}</span><span>${fmt(p.budget)} جنيه <button class="x" aria-label="حذف" onclick="delP('${p.id}')">×</button></span></div>`).join(''):empty('ضيف أصحابك عشان تبدأ')}
  </div>${S.people.length?`<div class="big">إجمالي ميزانية المجموعة: <span data-count="${tot}" data-ck="tot" data-u="جنيه">${fmt(tot)} جنيه</span></div>`:''}`;
}
function addP(){
  const n=$('#pn').value.trim();if(!n)return;
  const p={id:'p'+Date.now()+Math.floor(Math.random()*999),name:n,budget:parseFloat($('#pb').value)||0};
  S.people.push(p);S.avail[p.id]={s:'f',h:18};render();
}
function delP(id){
  S.people=S.people.filter(p=>p.id!==id);delete S.avail[id];
  S.exp=S.exp.filter(e=>e.payer!==id);S.exp.forEach(e=>e.parts=e.parts.filter(i=>i!==id));render();
}

/* الوقت */
function v1(){
  if(!S.people.length){$('#main').innerHTML=`<div class="card">${empty('ضيف الناس الأول من تبويب «الناس»')}</div>`;return}
  let best=0,bh=null;
  for(let h=10;h<=23;h++){
    const c=S.people.filter(p=>{const a=S.avail[p.id]||{s:'f'};return a.s==='f'||(a.s==='p'&&a.h<=h)}).length;
    if(c>best){best=c;bh=h}
  }
  $('#main').innerHTML=`<div class="card"><h3>مين فاضي؟</h3>${S.people.map(p=>{const a=S.avail[p.id]||{s:'f',h:18};
  return `<div class="r"><span>${esc(p.name)}</span><span><select onchange="setA('${p.id}','s',this.value)">
  <option value="f" ${a.s==='f'?'selected':''}>🟢 متاح</option><option value="p" ${a.s==='p'?'selected':''}>🟡 من ساعة معينة</option><option value="b" ${a.s==='b'?'selected':''}>🔴 مش متاح</option></select>
  ${a.s==='p'?`<select onchange="setA('${p.id}','h',+this.value)">${Array.from({length:14},(_,i)=>i+10).map(h=>`<option value="${h}" ${a.h===h?'selected':''}>${hr(h)}</option>`).join('')}</select>`:''}</span></div>`}).join('')}</div>
  <div class="big">${bh===null?'محدش متاح لسه':`أفضل وقت: الساعة ${hr(bh)} — ${best} من ${S.people.length} متاحين`}</div>`;
}
function setA(id,k,v){S.avail[id]=Object.assign({s:'f',h:18},S.avail[id],{[k]:v});render()}

/* المكان */
function v2(){
  const mx=Math.max(0,...S.places.map(p=>p.v));
  const tot=S.people.reduce((a,p)=>a+p.budget,0);
  let cmp='';

function calc(){
  const b={},sh={},pd={};S.people.forEach(p=>{b[p.id]=0;sh[p.id]=0;pd[p.id]=0});
  S.exp.forEach(e=>{const ps=e.parts.filter(i=>b[i]!==undefined);if(!ps.length||b[e.payer]===undefined)return;
    pd[e.payer]+=e.amount;b[e.payer]+=e.amount;ps.forEach(i=>{sh[i]+=e.amount/ps.length;b[i]-=e.amount/ps.length})});
  const cr=[],db=[];S.people.forEach(p=>{const v=fmt(b[p.id]);if(v>0.01)cr.push([p.id,v]);else if(v<-0.01)db.push([p.id,-v])});
  cr.sort((x,y)=>y[1]-x[1]);db.sort((x,y)=>y[1]-x[1]);
  const tr=[];let i=0,j=0;
  while(i<db.length&&j<cr.length){const m=Math.min(db[i][1],cr[j][1]);tr.push([db[i][0],cr[j][0],m]);db[i][1]-=m;cr[j][1]-=m;if(db[i][1]<0.01)i++;if(cr[j][1]<0.01)j++}
  return{b,sh,pd,tr};
}

const CNT={};
function countUp(){
  const rm=matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.querySelectorAll('[data-count]').forEach(el=>{
    const to=parseFloat(el.dataset.count),k=el.dataset.ck,from=CNT[k]===undefined?0:CNT[k];
    CNT[k]=to;
    const dec=(String(to).split('.')[1]||'').length,u=el.dataset.u||'';
    const show=v=>{el.textContent=v.toFixed(dec).replace(/(\.\d*?)0+$/,'$1').replace(/\.$/,'')+' '+u};
    if(rm||from===to||isNaN(to)){show(to);return}
    const t0=performance.now(),D=700;
    const step=t=>{
      if(!el.isConnected)return;
      const r=Math.min((t-t0)/D,1),e=1-Math.pow(1-r,3);
      show(from+(to-from)*e);
      if(r<1)requestAnimationFrame(step);else show(to);
    };
    show(from);requestAnimationFrame(step);
  });
}

  ${S.exp.map(e=>ln(esc(e.title)+' ('+esc(nm(e.payer))+')',fmt(e.amount))).join('')}<hr>
  ${ln('الإجمالي',fmt(total)+' جنيه','tt')}<hr>
  ${c.tr.length?c.tr.map(t=>ln(esc(nm(t[0]))+' يدفع لـ '+esc(nm(t[1])),fmt(t[2]))).join(''):'<div class="rc">الحساب متساوي</div>'}<hr>
  <div class="rc">شكراً لاستخدامك Freet</div></article>`;
  el.innerHTML=`<section class="rp" data-stage="idle" aria-label="طابعة الفاتورة">
  <button class="btn rp-b" id="rpb">اطبع الفاتورة</button>
  <div class="rp-m"><div class="rp-h"><div class="rp-st"><span class="rp-ic" id="rpi"></span><span id="rpt" role="status" aria-live="polite">جاهزة للطباعة</span></div></div>
  <div class="rp-s"><div class="m3">الفاتورة</div><div class="rs-t">${esc(S.name)}</div><div class="rs-v" data-count="${total}" data-ck="rcpt" data-u="جنيه">${fmt(total)} جنيه</div></div>
  <div class="rp-slot" aria-hidden="true"></div></div>
  <div class="rp-o"><div class="rp-f" id="rpf" aria-hidden="true">${paper}</div></div></section>`;
  const sec=el.querySelector('.rp'),f=$('#rpf'),tx=$('#rpt'),ic=$('#rpi'),b=$('#rpb');
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const wait=ms=>new Promise(r=>setTimeout(r,ms));
  const stage=(st,t)=>{
    if(id!==rpRun||!document.body.contains(sec))return false;
    sec.dataset.stage=st;tx.textContent=t;
    ic.innerHTML=st==='complete'?RP_OK:'<span class="spin"></span>';
    if(!reduce)tx.animate([{opacity:0,transform:'translateY(4px)'},{opacity:1,transform:'translateY(0)'}],{duration:180,easing:'cubic-bezier(.23,1,.32,1)'});
    return true;
  };
  b.onclick=async()=>{
    b.disabled=true;f.setAttribute('aria-hidden','true');
    f.getAnimations().forEach(a=>a.cancel());
    f.style.opacity=0;f.style.transform='translateY(calc(-100% + 2px))';
    if(!stage('processing','بنحسب الحساب'))return;
    await wait(reduce?0:1100);
    if(!stage('printing','بنطبع الفاتورة'))return;
    f.style.opacity=1;
    if(reduce){f.style.transform='translateY(0)'}
    else{
      const kf=RP_T.map((v,i)=>({transform:i===0?'translateY(calc(-100% + 2px))':'translateY('+v+'%)',offset:RP_O[i]}));
      const a=f.animate(kf,{duration:1750,easing:'linear',fill:'forwards'});
      try{await a.finished}catch(e){}
      f.style.transform='translateY(0)';a.cancel();
    }
    if(!stage('complete','الفاتورة جاهزة'))return;
    f.removeAttribute('aria-hidden');b.disabled=false;b.textContent='اطبع تاني';
  };
}

/* حسابي والتبرع */
const DONATE={link:'',instapay:'',cash:''};
function cp(t,b){try{navigator.clipboard.writeText(t);b.textContent='اتنسخ ✓'}catch(e){b.textContent='انسخه يدوي'}}
function drow(l,v){return `<div class="r"><span>${l}<div class="m">${esc(v)}</div></span><button class="btn" data-v="${esc(v)}" onclick="cp(this.dataset.v,this)">انسخ</button></div>`}
function v5(){

  if(DONATE.cash)d.push(drow('فودافون كاش',DONATE.cash));

  <div class="don"><h3 style="margin:0 0 6px">هدية لـ Freet</h3>
  <div class="m" style="margin-bottom:8px">لو Freet وفّر عليك وقت وفلوس في خروجاتك، تقدر تبعتله هدية صغيرة تساعدنا نكمّل ونضيف مميزات جديدة. التبرع اختياري تمامًا، والتطبيق شغال كامل من غيره.</div>
  ${d.length?d.join(''):'<div class="empty">طرق إرسال الهدية هتتضاف قريبًا</div>'}</div>`;
}
/* بروفايل ونقاط */
let MSG='';
const IG='https://www.instagram.com/freeeeeett?vrfl=MTNybmljY3J5aXoybw==';
const FR=[['','عادي',0],['night','ليلي',300],['gold','ذهبي',500],['neon','نيون',700],['fire','ناري',900],['diamond','ألماس',1500],['rainbow','قوس قزح',2500]];
const TH=[['','الأزرق',0,'#38A9DB','#0B3A5B','linear-gradient(135deg,#0B3A5B,#38A9DB)'],['sunset','غروب',400,'#ff7a45','#2b1000','linear-gradient(135deg,#7a1f35,#ff7a45)'],['mint','نعناع',600,'#2ec99a','#04281e','linear-gradient(135deg,#0b5a4a,#2ec99a)'],['violet','بنفسجي',900,'#8b6cff','#140a3d','linear-gradient(135deg,#2b1b6b,#8b6cff)'],['royal','ملكي',1600,'#d4a017','#241a00','linear-gradient(135deg,#3a2a00,#d4a017)']];
const blankPf=()=>({pts:0,photos:[],av:0,frame:'',own:[],ig:0,theme:''});
const getPf=id=>{const p=S.people.find(x=>x.id===id);if(p&&p.uid)return PFC[p.uid]||(PFC[p.uid]=blankPf());return S.pf[id]||(S.pf[id]=blankPf())};
const peekPf=id=>{const p=S.people.find(x=>x.id===id);return p&&p.uid?PFC[p.uid]:S.pf[id]};
const getTh=id=>{const f=peekPf(id===undefined?myPid():id);return TH.find(t=>t[0]===(f&&f.theme))||TH[0]};
function applyTheme(){const r=document.documentElement.style,t=getTh();if(!t[0]){['--ac','--onac','--acs'].forEach(k=>r.removeProperty(k));return}r.setProperty('--ac',t[3]);r.setProperty('--onac',t[4]);r.setProperty('--acs','color-mix(in srgb,'+t[3]+' 18%,var(--bg))')}
function award(id,n,m){getPf(id).pts+=n;MSG=m+' (+'+n+' نقطة)';render()}
const upl=()=>`<input type="file" accept="image/*" multiple onchange="addPh(this)" aria-label="ارفع صورة" style="position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0">`;
function profileHtml(){
  if(!S.people.length)return `<div class="card">${empty('ضيف ناس الأول من تاب الناس عشان يبقى لهم بروفايل')}</div>`;
  if(!S.people.some(p=>p.id===S.psel))S.psel=myPid()||S.people[0].id;
  const m=MSG;MSG='';
  const id=S.psel,f=getPf(id),p=S.people.find(x=>x.id===id),ph=f.photos[f.av],done=0,t=getTh(id);
  return `<div class="card cv" style="background:${t[5]};color:#fff;border:0"><select onchange="S.psel=this.value;render()" style="width:100%;margin-bottom:10px">${S.people.map(q=>`<option value="${q.id}" ${q.id===id?'selected':''}>${esc(q.name)}</option>`).join('')}</select>
  <div style="display:flex;align-items:center;gap:14px"><div style="position:relative;flex:none">${ph?`<img class="av fr-${f.frame}" src="${ph}" alt="">`:`<div class="av fr-${f.frame}" style="color:var(--ink)">${esc(p.name.slice(0,1))}</div>`}${upl()}</div>
  <div><b style="font-size:20px">${esc(p.name)}</b><div class="pts" data-count="${f.pts}" data-ck="pts${id}" data-u="نقطة">${f.pts} نقطة</div><div style="font-size:12px;opacity:.85">دوس على الصورة تغيّرها</div></div></div>
  ${m?`<div class="big" style="margin-top:10px;color:#0B3A5B" role="status">${esc(m)}</div>`:''}</div>
  <div class="card"><h3>صورنا</h3><div class="ph">${f.photos.map((s,i)=>`<span style="position:relative;flex:none"><img src="${s}" alt="" onclick="setAv(${i})" style="${i===f.av?'outline:3px solid var(--ac)':''}"><button class="x" style="position:absolute;top:0;left:0;background:var(--card);border-radius:99px" aria-label="مسح" onclick="delPh(${i})">×</button></span>`).join('')}</div>
  <div style="position:relative;margin-top:8px"><div class="btn" style="text-align:center">+ ارفع صورة من الموبايل</div>${upl()}</div></div>
  <div class="card"><h3>اكسب نقط</h3>
  <div class="r"><span>تابع Freet على انستجرام<div class="m">+500 مرة واحدة</div></span><a class="btn" href="${IG}" target="_blank" rel="noopener" onclick="igFollow()">${f.ig?'متابَع ✓':'تابع'}</a></div></div>
  <div class="card"><h3>الإطارات</h3>${FR.map(([k,n,c])=>{const own=!c||f.own.includes(k);return `<div class="r"><span style="display:flex;align-items:center;gap:10px"><span class="av fr-${k}" style="width:30px;height:30px;font-size:0"></span>${n}</span>${f.frame===k?'<span class="ok">مستخدم</span>':`<button class="btn" ${!own&&f.pts<c?'disabled':''} onclick="buyFr('${k}',${c})">${own?'استخدم':c+' نقطة'}</button>`}</div>`}).join('')}</div>
  <div class="card"><h3>الثيمات</h3>${TH.map(([k,n,c,,,g])=>{const own=!c||f.own.includes('t'+k);return `<div class="r"><span style="display:flex;align-items:center;gap:10px"><span style="width:30px;height:30px;border-radius:8px;background:${g};flex:none"></span>${n}</span>${f.theme===k?'<span class="ok">مستخدم</span>':`<button class="btn" ${!own&&f.pts<c?'disabled':''} onclick="buyTh('${k}',${c})">${own?'استخدم':c+' نقطة'}</button>`}</div>`}).join('')}</div>`;
}
function setAv(i){if(!okEdit())return;getPf(S.psel).av=i;render()}
function delPh(i){if(!okEdit())return;const f=getPf(S.psel);f.photos.splice(i,1);f.av=0;render()}
function addPh(inp){if(!okEdit())return;const f=getPf(S.psel),fs=[...inp.files].slice(0,6);inp.value='';fs.forEach(file=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{const c=document.createElement('canvas'),k=Math.min(1,480/Math.max(im.width,im.height));c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);f.photos.push(c.toDataURL('image/jpeg',.75));if(f.photos.length>12)f.photos.shift();f.av=f.photos.length-1;URL.revokeObjectURL(u);render()};im.onerror=()=>{MSG='الصورة دي مش مدعومة، جرب صورة تانية';render()};im.src=u})}
function buyFr(k,c){if(!okEdit())return;const f=getPf(S.psel);if(!c||f.own.includes(k))f.frame=k;else if(f.pts>=c){f.pts-=c;f.own.push(k);f.frame=k;MSG='مبروك الإطار الجديد 🎉'}render()}
function buyTh(k,c){if(!okEdit())return;const f=getPf(S.psel);if(!c||f.own.includes('t'+k))f.theme=k;else if(f.pts>=c){f.pts-=c;f.own.push('t'+k);f.theme=k;MSG='مبروك الثيم الجديد 🎨'}render()}
function dist(a,b,c,d){const R=6371e3,r=x=>x*Math.PI/180,u=r(c-a),v=r(d-b),h=Math.sin(u/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(v/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
/* Check in مربوط بالمكان: حالة (جوه/بره) لكل مكان، والسيرفر هو اللي بيرتّب الوصول */
const CI_COOLDOWN=15; /* دقايق بين نقطتين لنفس الشخص في نفس المكان (نفس الرقم في الـ SQL) */
const curPlace=()=>{const top=[...S.places].sort((a,b)=>b.v-a.v)[0];return (S.loc.name||(top?top.name:'')||'').trim()};
const plKey=()=>S.loc.lat!=null?'g'+S.loc.lat.toFixed(3)+','+S.loc.lng.toFixed(3):(curPlace()?'n'+curPlace().toLowerCase():'');
async function checkIn(){
  const k=plKey();
  if(!k){MSG='حدد اسم المكان الأول';return render()}
  if(PRES.some(r=>r.place_key===k&&r.user_id===ME.id))return;
  if(S.loc.lat!=null&&navigator.geolocation){try{const p=await new Promise((ok,no)=>navigator.geolocation.getCurrentPosition(ok,no,{enableHighAccuracy:true,timeout:8000}));const d=dist(p.coords.latitude,p.coords.longitude,S.loc.lat,S.loc.lng);if(d>500){MSG='لسه بعيد '+Math.round(d)+' متر عن المكان';return render()}}catch(e){}}
  const {data,error}=await sb.rpc('check_in',{p_outing:S.oid,p_place:k});
  if(error){MSG='مشكلة في الـ Check in: '+error.message;return render()}
  await loadPresence(false);
  S.psel=myPid();
  if(data.award){const n=data.n,g=n===1?100:Math.max(20,60-(n-1)*10);award(S.psel,g,n===1?'أنت الأول! 🥇':'وصلت رقم '+n)}
  else{MSG='اتسجّل وصولك. النقط بتتحسب بعد '+CI_COOLDOWN+' دقيقة من آخر مرة';render()}
}
async function checkOut(){
  const k=plKey();if(!k)return;
  const {error}=await sb.rpc('check_out',{p_outing:S.oid,p_place:k});
  if(error){MSG='مشكلة: '+error.message;return render()}
  await loadPresence(false);
  MSG='خرجت من المكان، تقدر تعمل Check in تاني لما ترجع';render();
}
function ciCard(){
  if(!S.oid||!ME)return '';
  const k=plKey(),rows=PRES.filter(r=>r.place_key===k).sort((a,b)=>a.n-b.n),inn=rows.some(r=>r.user_id===ME.id);
  return `<div class="card"><h3>وصلت المكان؟ ${k?'· '+esc(curPlace()):''}</h3>
  <div class="f">${inn?`<button class="btn" onclick="checkOut()">خرجت من المكان</button>`:`<button class="btn" onclick="checkIn()">Check in</button>`}</div>
  <div class="m">أول واحد يوصل ياخد 100 والباقي أقل. لو خرجت ورجعت تاني بيتحسب من جديد.</div>
  ${rows.map(r=>`<div class="r"><span>${r.n}. ${esc(userName(r.user_id))}</span><span class="ok">جوه ✓</span></div>`).join('')||(k?'':empty('اكتب اسم المكان فوق الأول'))}</div>`;
}

function igFollow(){if(!okEdit())return;const id=S.psel,f=getPf(id);if(f.ig)return;f.ig=1;setTimeout(()=>award(id,500,'شكرًا على المتابعة'),600)}

/* التيكت واللوكيشن */
function bestHour(){let best=0,bh=null;for(let h=10;h<=23;h++){const c=S.people.filter(p=>{const a=S.avail[p.id]||{s:'f'};return a.s==='f'||(a.s==='p'&&a.h<=h)}).length;if(c>best){best=c;bh=h}}return bh}
const mapUrl=()=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(S.loc.lat!=null?S.loc.lat+','+S.loc.lng:(S.loc.name||''));
function useMe(){navigator.geolocation.getCurrentPosition(p=>{S.loc.lat=p.coords.latitude;S.loc.lng=p.coords.longitude;if(!S.loc.name)S.loc.name='موقعي الحالي';render()},()=>{MSG='مقدرتش أوصل للموقع، اسمح بالإذن';render()},{enableHighAccuracy:true,timeout:8000})}

  <div class="er">${esc(m)}</div></div>

  <div class="tk" id="tk"><div class="tk-in"><div class="tk-b"><div class="tk-k">FREET • تيكت الخروجة</div><div class="tk-t">${esc(S.name)}</div>

  const t=$('#tk');if(matchMedia('(hover:hover) and (pointer:fine) and (prefers-reduced-motion:no-preference)').matches){
    t.onpointermove=e=>{const r=t.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;t.style.transform=`perspective(1100px) rotateX(${-y*12}deg) rotateY(${x*12}deg) scale(1.018)`};
    t.onpointerleave=()=>{t.style.transform=''}}
}

render();initAuth();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
